<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
</head>
<body>

    <!-- شريط الروابط لربط الصفحة بباقي الصفحات -->
    <a href="index.html">Home</a> | 
    <a href="about.html">About Us</a> | 
    <a href="contact.html">Contact Us</a>

    <h1>Contact Us</h1>
    <p>Have questions or want to work together? Fill out the form below:</p>

    <!-- استمارة التواصل الخاصة بك -->
    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="Enter your full name"><br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" placeholder="name@example.com"><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" placeholder="e.g. 20"><br><br>

        <label for="date">Preferred Contact Date:</label>
        <input type="date" id="date"><br><br>

        <fieldset>
            <legend>Gender:</legend>
            <input type="radio" id="male" name="gender">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender">
            <label for="other">Other</label>
        </fieldset><br>

        <fieldset>
            <legend>Interests:</legend>
            <input type="checkbox" id="web" checked>
            <label for="web">Web Development</label>
            <input type="checkbox" id="ui">
            <label for="ui">UI/UX Design</label>
            <input type="checkbox" id="ai">
            <label for="ai">Artificial Intelligence</label>
        </fieldset>
    </form>

</body>
</html>
